<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #FDF8F3 0%, #E8F0F8 50%, #FDE8E3 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  .card {
    background: white;
    border-radius: 32px;
    padding: 60px 80px;
    text-align: center;
    max-width: 900px;
    box-shadow: 0 8px 40px rgba(91, 141, 184, 0.12);
  }
  .badge {
    display: inline-block;
    background: #E8F0F8;
    color: #3D6F99;
    font-size: 18px;
    font-weight: 600;
    padding: 8px 24px;
    border-radius: 100px;
    margin-bottom: 24px;
    letter-spacing: 0.5px;
  }
  .title {
    font-size: 52px;
    font-weight: 700;
    color: #2C3E50;
    line-height: 1.2;
    margin-bottom: 20px;
  }
  .title span {
    color: #5B8DB8;
  }
  .subtitle {
    font-size: 22px;
    color: #6B7B8D;
    line-height: 1.5;
    margin-bottom: 32px;
  }
  .features {
    display: flex;
    gap: 32px;
    justify-content: center;
  }
  .feature {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 16px;
    color: #5E9470;
    font-weight: 600;
  }
  .dot {
    width: 10px;
    height: 10px;
    background: #7BAE8C;
    border-radius: 50%;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="badge">Free Tool for NHS Staff</div>
    <div class="title">NHS <span>Maternity Pay</span><br>Calculator</div>
    <div class="subtitle">Estimate your Occupational Maternity Pay, SMP &amp; total leave income based on your NHS pay band</div>
    <div class="features">
      <div class="feature"><div class="dot"></div>All NHS Pay Bands</div>
      <div class="feature"><div class="dot"></div>100% Private</div>
      <div class="feature"><div class="dot"></div>Instant Results</div>
    </div>
  </div>
</body>
</html>
